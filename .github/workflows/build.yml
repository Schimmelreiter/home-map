name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: write
jobs:
  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version-file: app/go.mod, cache-dependency-path: app/go.sum}
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with: {name: home-map, path: dist/home-map.exe}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: {files: dist/home-map.exe}
